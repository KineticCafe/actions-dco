# DCO check configuration for actions-dco itself.
#
# This is read by `actions-dco` from the `KineticCafe/actions-dco` main branch. It is the
# only configuration source for this repository's own check.

comment = true

[bots]
policy = "well-known"
categories = ["dependency-updaters", "ci-cd", "release"]

[ai]
signed-off-by = "reject"
co-authored-by = "reject"
trace-detection = "reject"
