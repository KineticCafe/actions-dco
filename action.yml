name: 'Enforce DCO Sign-off'
description: |
  Enforce Developer Certificate of Origin (DCO) sign-off on Pull Requests.
author: 'Austin Ziegler'

inputs:
  repo-token:
    description: |
      The GitHub token for use with this action. Must have permission to read pull request
      details. When comments are enabled, add `pull-requests: write`.
    required: false
    default: ${{ github.token }}

  config:
    description: |
      Embedded TOML configuration. See documentation for the full configuration reference.
      Must not be set if a default branch configuration file exists; the run fails if both
      are present.
    required: false
    default: ''

runs:
  using: 'node24'
  main: 'dist/dco_check.cjs'

branding:
  icon: check-circle
  color: blue
